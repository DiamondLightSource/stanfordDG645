# Protocol file for Stanford Digital Delay Generator DG645

ReplyTimeout = 1000;
Terminator = CR LF;

setRemote {            
          out "%{LCAL|REMT}";
          in "%{LCAL|REMT}";
}

getDelay {
         out "DLAY?\$1";
         in "%*u,%f";
}

setDelay {
         out "DLAY \$1,\$2,%e";
         in "DLAY \$1,\$2,%e";
}

